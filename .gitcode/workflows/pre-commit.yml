name: pre-commit

on:
  workflow_dispatch:
  pull_request: # 配置中无密钥引用，使用 pull_request 触发
    branches:
      - "*"
  pull_request_comment: # PR 评论事件：当用户在 PR 中发表评论时触发
    types: [created]
    comments: ["/pre-commit"]
    branches:
      - "*"

permissions:
  repository: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ["self-hosted", "default"]
    steps:
      - name: Checkout repository
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha || atomgit.event.pull_request.head.sha }} # 使用预合并后的 commit SHA 进行检出，确保 CI 检查的是 PR 与目标分支合并后的最终代码状态
          fetch-depth: 0 # 全量检出以生成基线远端 ref origin/<目标分支>，供 pre-commit-action v1.1.0 增量比较（未传 gc_token 时必需）

      - name: bootstrap tool cache dir
        run: |
          if [ ! -d /opt/tools/cache ] || [ ! -w /opt/tools/cache ]; then
            sudo mkdir -p /opt/tools/cache
            sudo chown -R "$(id -u):$(id -g)" /opt/tools
          fi

      - name: setup-node
        uses: setup-node
        with:
          node-version: 20
          cache: true

      - name: setup-prettier
        run: |
          npm install --save-dev --save-exact prettier@3.9.5
          npx -v
          npx prettier --version

      - name: setup-go
        uses: setup-go
        with:
          version: 1.26
          cache: true

      - name: pre-commit
        uses: openlibing/pre-commit-action@v1.1.0
        with:
          extra_args: ${{ inputs.extra_args }}
